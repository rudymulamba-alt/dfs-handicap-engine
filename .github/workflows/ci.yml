name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          PARLAY_API2: ${{ secrets.PARLAY_API2 }}
          SPORTSBOOKODDS: ${{ secrets.SPORTSBOOKODDS }}
          PARLAYAPI_API_KEY: ${{ secrets.PARLAYAPI_API_KEY }}
          PARLAY_API_BASE_URL: ${{ secrets.PARLAY_API_BASE_URL }}
          DATABASE_URL: "sqlite:///test_engine.db"
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Verify main pipeline runs
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          PARLAY_API2: ${{ secrets.PARLAY_API2 }}
          SPORTSBOOKODDS: ${{ secrets.SPORTSBOOKODDS }}
          PARLAYAPI_API_KEY: ${{ secrets.PARLAYAPI_API_KEY }}
          PARLAY_API_BASE_URL: ${{ secrets.PARLAY_API_BASE_URL }}
          DATABASE_URL: "sqlite:///test_engine.db"
        run: |
          python main.py
